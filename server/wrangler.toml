# 두뇌실험실 익명 응시 통계 서버 · Cloudflare Workers + D1
# 배포: npx wrangler deploy (server 폴더에서). 비밀 값(ADMIN_TOKEN)은 npx wrangler secret put ADMIN_TOKEN 으로 넣고 저장소에는 두지 않는다.
name = "brainlab-stats"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
# 전송(POST /submit)을 받아 주는 사이트 주소. 쉼표로 구분. 로컬 미리보기(node serve.cjs)도 포함.
ALLOWED_ORIGINS = "https://duscjf0098.github.io,http://localhost:5173,http://127.0.0.1:5173"
# 요청 본문 최대 크기(바이트). 결과 하나는 보통 1~2KB.
MAX_BODY = "16384"
# 이 수 미만이면 분포(백분위)를 돌려주지 않는다. 사이트도 같은 기준으로 "실제 응시자 기준"을 숨긴다.
MIN_SAMPLE = "30"

[[d1_databases]]
binding = "DB"
database_name = "brainlab-stats"
# npx wrangler d1 create brainlab-stats 가 출력한 database_id 로 바꾼다
database_id = "00000000-0000-0000-0000-000000000000"

# 요청 빈도 제한. IP당 60초에 전송 20회·조회 60회. Cloudflare 안의 순간 계수기라 IP가 어디에도 저장되지 않는다.
[[ratelimits]]
name = "RL_SUBMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_READ"
namespace_id = "1002"
simple = { limit = 60, period = 60 }