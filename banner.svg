<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="두뇌실험실 배너">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4f2"/>
      <stop offset="1" stop-color="#fff3d6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0f766e" opacity=".18"/>
    </pattern>
    <clipPath id="half"><rect x="455" y="196" width="40" height="80"/></clipPath>
  </defs>
  <rect width="1200" height="420" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="36" fill="url(#dots)"/>

  <!-- 왼쪽: 육각 틀 안의 화살표 -->
  <g transform="translate(190 210)">
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#ffffff" stroke="#0f766e" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-74 44,-26 20,-26 20,70 -20,70 -20,-26 -44,-26" fill="#0f766e"/>
    <circle cx="-78" cy="-78" r="7" fill="#f59e0b"/>
    <circle cx="78" cy="78" r="7" fill="#f59e0b"/>
  </g>

  <!-- 가운데: 2×2 행렬 -->
  <g transform="translate(410 150)">
    <rect x="0" y="0" width="100" height="100" rx="18" fill="#fff" stroke="#0f766e" stroke-width="4"/>
    <circle cx="50" cy="50" r="26" fill="#0f766e"/>
    <rect x="120" y="0" width="100" height="100" rx="18" fill="#fff" stroke="#0f766e" stroke-width="4"/>
    <rect x="146" y="26" width="48" height="48" rx="8" fill="none" stroke="#0f766e" stroke-width="5"/>
    <rect x="0" y="120" width="100" height="100" rx="18" fill="#fff" stroke="#0f766e" stroke-width="4"/>
    <polygon points="50,146 76,194 24,194" fill="#f59e0b"/>
    <rect x="120" y="120" width="100" height="100" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="170" y="186" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="52" font-weight="800" fill="#f59e0b">?</text>
  </g>

  <!-- 오른쪽: 별, 저울, 말풍선 -->
  <g transform="translate(760 120)">
    <polygon points="60,0 76,40 120,44 86,72 96,116 60,92 24,116 34,72 0,44 44,40" fill="#f59e0b" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(900 230)" stroke="#0f766e" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="180" y2="0"/>
    <polygon points="90,0 74,66 106,66" fill="#fff"/>
    <line x1="20" y1="0" x2="20" y2="34"/><path d="M-18,34 Q20,64 58,34"/>
    <line x1="160" y1="0" x2="160" y2="34"/><path d="M122,34 Q160,64 198,34"/>
    <circle cx="8" cy="22" r="9" fill="#0f766e" stroke="none"/><circle cx="32" cy="22" r="9" fill="#0f766e" stroke="none"/>
    <rect x="146" y="8" width="28" height="28" rx="6" fill="#f59e0b" stroke="none"/>
  </g>
  <g transform="translate(1010 60)">
    <path d="M0,22 a22,22 0 0 1 22,-22 h70 a22,22 0 0 1 22,22 v40 a22,22 0 0 1 -22,22 h-36 l-26,22 v-22 h-8 a22,22 0 0 1 -22,-22 z" fill="#ffffff" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="36" cy="42" r="6" fill="#0f766e"/><circle cx="58" cy="42" r="6" fill="#0f766e"/><circle cx="80" cy="42" r="6" fill="#0f766e"/>
  </g>

  <!-- 흩어진 점·선 -->
  <g fill="#0f766e" opacity=".55">
    <circle cx="340" cy="70" r="6"/><circle cx="700" cy="330" r="8"/><circle cx="1120" cy="330" r="5"/><circle cx="560" cy="380" r="5"/>
  </g>
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity=".7">
    <line x1="640" y1="80" x2="690" y2="80"/><line x1="665" y1="55" x2="665" y2="105"/>
    <line x1="1060" y1="360" x2="1110" y2="360"/>
  </g>
</svg>
